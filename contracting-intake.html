<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Colburn Agency — Contracting has moved</title>
<meta name="robots" content="noindex" />
<!--
  This page used to be the standalone New Agent Contracting Form.
  Contracting now lives as Step 6 of the onboarding checklist.

  This file is kept ONLY as a redirect, because stage emails sent before
  2026-08-15 point recruits here. The old form had no ?r= token handling, no
  "previous email" fallback and no validation, so anyone landing on it
  submitted details that could not be matched back to their pipeline record.

  Any ?r=<recruit id> token in the URL is carried through to the new page so
  the match still works.
-->
<script>
  (function () {
    var qs = '';
    try {
      var r = new URLSearchParams(location.search).get('r') || '';
      if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(r)) {
        qs = '?r=' + r;
      }
    } catch (e) {}
    location.replace('onboarding.html' + qs + '#contracting');
  })();
</script>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#eef1f5;color:#1c2b3a;display:grid;place-items:center;min-height:100vh;padding:20px}
  .card{background:#fff;border:1px solid #dde3ea;border-radius:14px;padding:30px 34px;max-width:460px;
    text-align:center;box-shadow:0 1px 3px rgba(16,40,74,.10),0 6px 20px rgba(16,40,74,.07)}
  .logo{width:52px;height:52px;border-radius:12px;background:#c9a45f;color:#0f294a;display:inline-grid;
    place-items:center;font-weight:800;font-size:22px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 8px;color:#0f294a}
  p{color:#6b7c8f;font-size:14px;line-height:1.55;margin:0 0 18px}
  a{display:inline-block;background:#0f294a;color:#fff;text-decoration:none;font-weight:700;
    font-size:14px;padding:12px 20px;border-radius:10px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">CA</div>
    <h1>Contracting has moved</h1>
    <p>It's now Step 6 of your onboarding checklist. Taking you there — if nothing happens, use the button below.</p>
    <a id="go" href="onboarding.html#contracting">Go to Step 6 — Contracting →</a>
  </div>
  <script>
    // Keep the manual fallback link personalized too.
    (function () {
      try {
        var r = new URLSearchParams(location.search).get('r') || '';
        if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(r)) {
          document.getElementById('go').href = 'onboarding.html?r=' + r + '#contracting';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
